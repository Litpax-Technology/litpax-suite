      <div class="hero-chip c1"><span class="dot r"></span>Store → WIP on first scan</div>
      <div class="hero-chip c2"><span class="dot y"></span>ERP updates itself</div>
      <div class="hero-chip c3"><span class="dot g"></span>Scan to dispatch</div>
    </div>
    <div class="hero-copy">
      <h1>One system for the whole line.</h1>
      <p>Orders, store, production and dispatch, connected end to end.</p>
    </div>
  </section>
  <section class="login-side">
    <div class="login-card">
      <img class="card-logo" src="assets/litpax-logo-dark.png" alt="Litpax" width="124" height="36">
      <div class="login-title">Sign in</div>
      <div class="login-sub">ERP · Inventory · Production · Store</div>
      <div class="field"><label class="lbl" for="userInput">Username</label>
      <input id="userInput" autocomplete="username" autocapitalize="off" spellcheck="false"></div>
      <div class="field"><label class="lbl" for="pinInput">Password</label>
      <input id="pinInput" type="password" autocomplete="current-password"></div>
      <div id="loginError" class="err"></div>
      <button id="loginBtn" class="btn btn-brand btn-block">Sign in</button>
      <div class="login-foot">One sign-in for every Litpax app</div>
    </div>
    <div class="login-copy">© Litpax Technology Pvt. Ltd.</div>
  </section>
</div>

<!-- ============ APP SHELL ============ -->
<div id="appShell" class="shell hidden">
  <main class="main">
    <!-- patli top bar: sirf app tabs. Har app apne sidebar se chalta hai, logout bhi wahi se -->
    <header class="topbar" id="topbar">
      <img class="top-logo" src="assets/litpax-logo-dark.png" alt="Litpax" width="83" height="24">
      <nav id="nav" class="tabs"></nav>
      <div class="topbar-right">
        <span id="sessionWarn" class="chip chip-warn hidden"></span>
        <button class="icon-btn top-ic" id="reloadBtn" title="Reload this page">↻</button>
        <span class="top-user" id="userName"></span>
        <button class="icon-btn top-ic" id="logoutBtn" title="Sign out">⏻</button>
      </div>
    </header>

    <!-- native views -->
    <section id="view-overview" class="view hidden"></section>
    <section id="view-inward" class="view hidden"></section>
    <section id="view-approvals" class="view hidden"></section>
    <section id="view-dispatch" class="view hidden"></section>
    <section id="view-settings" class="view hidden"></section>

    <!-- module iframes get added here -->
    <div id="frames" class="frames"></div>
  </main>
</div>

<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
